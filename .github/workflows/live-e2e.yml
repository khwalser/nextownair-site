name: Live browser E2E

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "itinerary.html"
      - "map.js"
      - "itinerary.js"
      - "trip-state.js"
      - "flight-provider.js"
      - "data.js"
      - "styles.css"
      - "netlify/functions/**"
      - "e2e/live-itinerary.mjs"
      - "e2e/multi-itinerary-smoke.mjs"
      - "e2e/phase4-regression.mjs"
      - "e2e/network-audit.mjs"
      - "e2e/schedule-coverage-audit.mjs"
      - "e2e/calendar-coverage-regression.mjs"
      - "e2e/calendar-pricing-progress-regression.mjs"
      - "e2e/fare-null-normalization-regression.mjs"
      - "e2e/flight-request-timeout-regression.mjs"
      - "e2e/flight-input-validation-regression.mjs"
      - "e2e/live-flight-validation.mjs"
      - "e2e/schedule-full-day-regression.mjs"
      - "docs/data-architecture.md"
      - ".github/workflows/live-e2e.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Immutable Netlify deploy URL or production URL to test"
        required: false
        default: "https://nextownair.com"
      route:
        description: "Comma-separated airport route"
        required: false
        default: "DTW,ROC,DTW"
      date:
        description: "Trip start date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://nextownair.com' }}
      E2E_ROUTE: ${{ inputs.route || 'DTW,ROC,DTW' }}
      E2E_DATE: ${{ inputs.date || '' }}
      E2E_OUT_DIR: artifacts

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Phase 4 deterministic prototype regression
        id: phase4
        run: node e2e/phase4-regression.mjs

      - name: Calendar coverage uncertainty regression
        id: calendar
        run: node e2e/calendar-coverage-regression.mjs

      - name: Verify calendar pricing progress and completion
        id: pricing
        run: node e2e/calendar-pricing-progress-regression.mjs

      - name: Regress missing fare amount normalization
        run: node e2e/fare-null-normalization-regression.mjs

      - name: Regress stalled flight and schedule requests
        run: node e2e/flight-request-timeout-regression.mjs

      - name: Verify flight API date and fare validation
        run: node e2e/flight-input-validation-regression.mjs

      - name: Audit route graph
        id: network
        run: node e2e/network-audit.mjs

      - name: Confirm full-day published schedule retrieval
        id: schedule
        run: node e2e/schedule-full-day-regression.mjs

      - name: Audit schedule fallback coverage
        id: coverage
        run: node e2e/schedule-coverage-audit.mjs

      - name: Wait for production deploy containing this exact MVP revision
        id: deployed
        if: ${{ !inputs.base_url || inputs.base_url == 'https://nextownair.com' }}
        run: |
          EXPECTED="$(grep -o '"mvpRevision": "[^"]*"' data.js | head -1 | cut -d'"' -f4)"
          if [ -z "$EXPECTED" ]; then
            echo "Local data.js has no mvpRevision marker."
            exit 1
          fi
          echo "Waiting for production MVP revision $EXPECTED"
          for i in {1..48}; do
            LIVE="$(curl -fsSL --max-time 15 https://nextownair.com/data.js | grep -o '"mvpRevision": "[^"]*"' | head -1 | cut -d'"' -f4 || true)"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Production MVP revision $LIVE is live."
              exit 0
            fi
            sleep 5
          done
          echo "Production did not expose expected MVP revision $EXPECTED."
          exit 1

      - name: Verify exact deployed frontend assets
        id: assets
        if: ${{ !inputs.base_url || inputs.base_url == 'https://nextownair.com' }}
        run: |
          for attempt in {1..48}; do
            match=1
            for asset in map.js itinerary.js trip-state.js flight-provider.js data.js; do
              expected="$(sha256sum "$asset" | cut -d' ' -f1)"
              actual="$(curl -fsSL --max-time 20 "https://nextownair.com/$asset" | sha256sum | cut -d' ' -f1)" || { match=0; break; }
              if [ "$expected" != "$actual" ]; then
                echo "Waiting on current production asset: $asset"
                match=0
                break
              fi
            done
            if [ "$match" -eq 1 ]; then
              echo "PASS: production serves exact checkout bytes of all five critical JavaScript assets"
              exit 0
            fi
            sleep 5
          done
          echo "Production asset mismatch: refusing to test a stale deployment."
          exit 1

      - name: Verify deployed fare API input validation
        run: node e2e/live-flight-validation.mjs

      - name: Install Playwright package
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save playwright@1.55.0
          which google-chrome
          google-chrome --version

      - name: Exercise four distinct production itineraries
        id: multi
        run: node e2e/multi-itinerary-smoke.mjs

      - name: Run live rendered itinerary test
        id: browser
        run: node e2e/live-itinerary.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish machine-readable acceptance result
        if: always()
        env:
          PHASE4: ${{ steps.phase4.outcome }}
          CALENDAR: ${{ steps.calendar.outcome }}
          PRICING: ${{ steps.pricing.outcome }}
          NETWORK: ${{ steps.network.outcome }}
          SCHEDULE: ${{ steps.schedule.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          DEPLOYED: ${{ steps.deployed.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
          MULTI: ${{ steps.multi.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          # Never overwrite an acceptance result for a newer application commit.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit supersedes this run; not publishing a stale result."
            exit 0
          fi
          mkdir -p .github
          node - <<'NODE'
          const fs=require('fs');
          const steps=Object.fromEntries(['phase4','calendar','pricing','network','schedule','coverage','deployed','assets','multi','browser'].map(k=>[k,process.env[k.toUpperCase()]||'unknown']));
          const passed=Object.values(steps).every(v=>v==='success'||v==='skipped')&&steps.multi==='success'&&steps.browser==='success';
          const report={testedCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runUrl:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,result:passed?'pass':'fail',steps,checkedAt:new Date().toISOString()};
          fs.writeFileSync('.github/last-live-e2e.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-live-e2e.json
          git commit -m "Record verified live E2E result [skip ci]" || exit 0
          git push origin HEAD:main
