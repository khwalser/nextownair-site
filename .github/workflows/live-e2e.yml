name: Live browser E2E

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "itinerary.html"
      - "map.js"
      - "itinerary.js"
      - "trip-state.js"
      - "flight-provider.js"
      - "data.js"
      - "styles.css"
      - "netlify/functions/**"
      - "e2e/live-itinerary.mjs"
      - "e2e/network-audit.mjs"
      - "docs/data-architecture.md"
      - ".github/workflows/live-e2e.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Immutable Netlify deploy URL or production URL to test"
        required: false
        default: "https://nextownair.com"
      route:
        description: "Comma-separated airport route"
        required: false
        default: "DTW,ROC,DTW"
      date:
        description: "Trip start date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://nextownair.com' }}
      E2E_ROUTE: ${{ inputs.route || 'DTW,ROC,DTW' }}
      E2E_DATE: ${{ inputs.date || '' }}
      E2E_OUT_DIR: artifacts

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit route graph
        run: node e2e/network-audit.mjs

      - name: Wait for production deploy containing this network revision
        if: ${{ !inputs.base_url || inputs.base_url == 'https://nextownair.com' }}
        run: |
          for i in {1..48}; do
            if curl -fsSL --max-time 15 https://nextownair.com/data.js | grep -q '"connectorRoutePairs": 14'; then
              echo "Production network revision is live."
              exit 0
            fi
            sleep 5
          done
          echo "Production did not expose the expected network revision."
          exit 1

      - name: Install Playwright package
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save playwright@1.55.0
          which google-chrome
          google-chrome --version

      - name: Run live rendered itinerary test
        run: node e2e/live-itinerary.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
