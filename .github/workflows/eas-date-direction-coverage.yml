name: Post-timeout EAS inventory probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      E2E_AUDIT_DATE: '2026-12-13'
      E2E_MAX_REQUESTS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node e2e/eas-date-direction-coverage.mjs
