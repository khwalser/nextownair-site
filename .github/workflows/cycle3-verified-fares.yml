name: Cycle 3 verified fare integrity
on:
  push:
    branches: [fix/provider-prototype-price-labels]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check itinerary.js
      - run: node e2e/verified-live-fares-regression.mjs
      - run: node e2e/calendar-coverage-regression.mjs
      - run: node e2e/calendar-pricing-progress-regression.mjs
      - run: node e2e/fare-null-normalization-regression.mjs
