name: Mobile E2E navigation regression
on:
  push:
    branches: [fix/mobile-e2e-navigation-resilience]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check e2e/live-itinerary.mjs
      - run: node e2e/mobile-navigation-regression.mjs
