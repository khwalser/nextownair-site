name: Travelport adapter regression
on:
  push:
    branches: [feature/travelport-onboarding]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  mocked-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check netlify/lib/travelport-client.mjs
      - run: node --check e2e/travelport-client-regression.mjs
      - run: node e2e/travelport-client-regression.mjs
