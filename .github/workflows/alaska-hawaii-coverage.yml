name: Alaska Hawaii network coverage
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/alaska-hawaii-route-visibility]
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check map.js
          node --check itinerary.js
          node --check data.js
          node e2e/alaska-hawaii-network-regression.mjs
          node e2e/schedule-evidence-conflict-regression.mjs
          node e2e/calendar-coverage-regression.mjs
          node e2e/verified-live-fares-regression.mjs
