name: Cycle 2 tentative itinerary fallback
on:
  push:
    branches: [fix/conflicting-itinerary-date-planning]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check itinerary.js
      - run: node e2e/conflicting-date-planning-regression.mjs
      - run: node e2e/schedule-evidence-conflict-regression.mjs
      - run: node e2e/calendar-pricing-progress-regression.mjs
