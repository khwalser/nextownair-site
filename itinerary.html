<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your NexTownAir Adventure</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8f1f7;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:900px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.muted{color:#91a8b9}.hero{margin:35px 0}.hero h1{font-size:40px;margin:4px 0}.card{background:#0d1c2c;border:1px solid #20364b;border-radius:16px;padding:18px;margin:12px 0}.flight{border-left:4px solid #67d4ff}.stay{border-left:4px solid #7ee2a8}.eyebrow{text-transform:uppercase;color:#67d4ff;font-size:11px;font-weight:800;letter-spacing:.12em}.row{display:flex;justify-content:space-between;gap:15px}.btn{display:inline-block;text-decoration:none;padding:10px 14px;border-radius:10px;background:#67d4ff;color:#06121d;font-weight:800}.btn2{background:transparent;border:1px solid #31516a;color:#dce9f1}.status{padding:12px;border-radius:12px;background:#081522;color:#9db1bf}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}</style></head><body><main><div class="top"><div class="brand">NexTownAir</div><a href="index.html" class="muted">← Explore map</a></div><section class="hero"><div class="eyebrow">Air-RV itinerary</div><h1>Your interesting way there.</h1><p class="muted" id="summary"></p></section><div id="status" class="status">Building your route. Live offers will be checked where available; discovery still works without them.</div><div id="cards"></div></main><script src="data.js"></script><script>
const API='https://transcendent-selkie-15860a.netlify.app/.netlify/functions/flight-proxy';const P=new URLSearchParams(location.search), D=NTA_DATA, by=c=>D.airports.find(a=>a.code===c);const stops=(P.get('stops')||'ESC,CMX').split(',').filter(Boolean), origin=P.get('from')||'DTW', destination=P.get('to')||'MSP', date=P.get('startDate')||new Date().toISOString().slice(0,10);document.getElementById('summary').textContent=`${origin} → ${stops.join(' → ')} → ${destination} · with room to stay awhile.`;
async function offer(a,b,d){try{let r=await fetch(`${API}?origin=${a}&destination=${b}&date=${d}`);if(!r.ok)return null;let x=await r.json();return Array.isArray(x)?x.find(f=>f.origin===a&&f.destination===b)||x[0]:null}catch(e){return null}}
function day(n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
async function build(){const c=document.getElementById('cards');let seq=[origin,...stops,destination],offset=0;for(let i=0;i<seq.length-1;i++){let a=seq[i],b=seq[i+1],dt=day(offset),f=await offer(a,b,dt),A=by(a),B=by(b);let div=document.createElement('div');div.className='card flight';div.innerHTML=`<div class="eyebrow">Day ${offset+1} · flight</div><div class="row"><div><h2>${a} → ${b}</h2><div class="muted">${A?.city||a} to ${B?.city||b} · ${dt}</div></div><div>${f&&f.priceFrom?`<b>$${Math.round(f.priceFrom)}</b><div class="small muted">live/test offer</div>`:'<span class="muted">schedule / fare not live</span>'}</div></div><div class="actions">${f?.bookUrl?`<a class="btn" target="_blank" rel="noopener" href="${f.bookUrl}">View flight options</a>`:''}</div>`;c.appendChild(div);if(i<stops.length){let S=by(b);let stay=document.createElement('div');stay.className='card stay';stay.innerHTML=`<div class="eyebrow">Stay 1–2 nights</div><h2>Get off the plane in ${S?.city||b}</h2><p>${S?.note||'Explore the town before the next hop.'}</p>${S?.stay?`<p class="muted">${S.stay.join(' · ')}</p>`:''}<div class="actions"><a class="btn btn2" href="index.html">Explore another airport</a></div>`;c.appendChild(stay);offset+=2}else offset+=1} }document.getElementById('status').innerHTML='<b>Prototype data mode:</b> map and route discovery come from the local NexTownAir dataset; live/test fares are layered in through the existing Amadeus proxy when available.'}build();
</script></body></html>
